---
- name: Setup Server with Git, Curl, Docker, Docker Compose, and Caddy
  hosts: webservers
  become: true
  tasks:

    - name: Update apt cache and install prerequisite packages
      apt:
        name:
          - git
          - curl
          - ca-certificates
          - gnupg
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
        state: present
        update_cache: yes

    # --- Docker Setup ---
    - name: Create directory for Docker keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris:
          - https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - stable
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker and Docker Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    # --- Caddy Setup ---
    - name: Download Caddy GPG key
      get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /etc/apt/trusted.gpg.d/caddy-stable.asc
        mode: '0644'

    - name: Add Caddy APT repository
      ansible.builtin.deb822_repository:
        name: caddy-stable
        types: [deb]
        uris:
          - https://dl.cloudsmith.io/public/caddy/stable/deb/debian
        suites:
          - any-version
        components:
          - main
        signed_by: /etc/apt/trusted.gpg.d/caddy-stable.asc
        state: present

    - name: Install Caddy Server
      apt:
        name: caddy
        state: present
        update_cache: yes

    - name: Deploy Caddy configuration with automatic HTTPS
      ansible.builtin.template:
        src: ../roles/common/templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Ensure Caddy service is running and enabled
      systemd:
        name: caddy
        state: restarted
        enabled: yes

    # --- Ollama Setup ---
    - name: Check whether Ollama is already installed
      ansible.builtin.command: command -v ollama
      register: ollama_bin
      changed_when: false
      failed_when: false

    - name: Install Ollama
      ansible.builtin.shell: |
        curl -fsSL https://ollama.com/install.sh | sh
      args:
        creates: /usr/local/bin/ollama
      when: ollama_bin.rc != 0

    - name: Configure Ollama host and port
      ansible.builtin.file:
        path: /etc/systemd/system/ollama.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Write Ollama service override
      ansible.builtin.copy:
        dest: /etc/systemd/system/ollama.service.d/override.conf
        content: |
          [Service]
          Environment="OLLAMA_HOST={{ ollama_host }}:{{ ollama_port }}"
        mode: '0644'
        owner: root
        group: root
      register: ollama_service_override

    - name: Reload systemd daemon if Ollama override changed
      ansible.builtin.systemd:
        daemon_reload: true
      when: ollama_service_override.changed

    - name: Ensure Ollama service is running and enabled
      ansible.builtin.systemd:
        name: ollama
        state: started
        enabled: true

    - name: Pull configured Ollama model
      ansible.builtin.command: /usr/local/bin/ollama pull {{ ollama_model }}
      register: ollama_pull
      changed_when: "'is already available' not in ollama_pull.stderr and 'already exists' not in ollama_pull.stderr"
      failed_when: ollama_pull.rc != 0

    - name: Show active Ollama model
      ansible.builtin.command: /usr/local/bin/ollama list
      register: ollama_list
      changed_when: false
