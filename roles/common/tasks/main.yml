---
- name: Ensure required base packages are installed
  ansible.builtin.apt:
    name: "{{ required_packages }}"
    state: present
    update_cache: true

- name: Ensure deployment user exists
  ansible.builtin.user:
    name: "{{ admin_user }}"
    state: present
    shell: /bin/bash
    create_home: true
    groups: sudo
    append: true
  when: admin_user != 'root'

- name: Set timezone
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  changed_when: false
  when: ansible_service_mgr == 'systemd'
